name: "CI — Explain (Tier 3)"

on:
  push:
    branches: [main]
    paths:
      - "src/rgan/explain/**"
      - "src/rgan/resample/**"
      - "tests/test_explain.py"
      - "pyproject.toml"
  pull_request:
    branches: [main]

jobs:
  explain:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install core + explain + dev deps
        run: uv sync --extra dev --extra explain

      - name: Test (pytest)
        run: uv run pytest tests/test_explain.py -m explain --tb=short -q
